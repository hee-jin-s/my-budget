<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>월간 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECF0EC; --card:#F8FAF7; --ink:#1E2A43; --muted:#6A7488; --line:#D3DAD3;
  --income:#D64545; --fixed:#5A6B92; --save:#2C8A67; --spend:#C49A1C; --left:#B9C3B9; --danger:#B4483B;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --income:#F07167;
    --paper:#141A24; --card:#1C2431; --ink:#E6EAF0; --muted:#97A1B3; --line:#2C3646;
    --fixed:#8A9BC4; --save:#4DBB92; --spend:#E2B83E; --left:#3A4556; --danger:#E07A6C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --income:#F07167;
  --paper:#141A24; --card:#1C2431; --ink:#E6EAF0; --muted:#97A1B3; --line:#2C3646;
  --fixed:#8A9BC4; --save:#4DBB92; --spend:#E2B83E; --left:#3A4556; --danger:#E07A6C;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 48px}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5;
  display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav button{width:40px;height:40px;border:0;background:transparent;color:var(--ink);font-size:20px;border-radius:50%;cursor:pointer}
.monthnav button:active{background:var(--line)}
.month{font-size:20px;font-weight:700;min-width:120px;text-align:center}
.sync{font-size:12px;color:var(--muted)}

/* 잔액 영역: 이 앱의 핵심 시각 요소 */
.hero{padding:8px 0 8px}
.leftrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.hero .label{color:var(--muted);font-size:14px}
.hero .big{font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:1.3}
.hero .big.neg{color:var(--danger)}
.bar{display:flex;height:22px;border-radius:4px;overflow:hidden;margin:16px 0 10px;background:var(--left)}
.bar span{display:block;height:100%;transition:width .35s ease}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:14px}
.legend div{display:flex;justify-content:space-between;gap:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.rate{margin-top:10px;font-size:14px;color:var(--muted)}

section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:16px;padding:14px 14px 10px}
section h2{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
section h2 small{font-size:15px;font-weight:500}
.hint{font-size:13px;color:var(--muted);margin:2px 0 8px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .nm{flex:1;min-width:0;display:flex;flex-direction:column}
li .nm .name{flex:none}
li .sub{font-size:12px;color:var(--muted)}
.freq{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.add .freq button{border:0;padding:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;height:34px;border-radius:6px;cursor:pointer}
.add .freq button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.preview{grid-column:1 / -1;font-size:13px;color:var(--muted);min-height:18px}
.preview b{color:var(--ink);font-weight:500}
li .date{color:var(--muted);font-size:13px;width:38px}
li .amt{font-weight:500}
li button.del{border:0;background:transparent;color:var(--muted);font-size:18px;width:32px;height:32px;cursor:pointer;border-radius:50%}
li button.del:active{background:var(--line)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.add{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.add select{min-width:0;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:0 8px;font:inherit;font-size:16px}
.tag{flex:none;font-size:12px;line-height:1;padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.breakdown{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.breakdown span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--paper)}
.breakdown b{font-weight:500;margin-left:6px}
.breakdown em{font-style:normal;color:var(--muted);margin-left:4px}
.add input{min-width:0;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);
  padding:0 10px;font:inherit;font-size:16px}
.add input.n{flex:1.3}
.add input.a{flex:1;text-align:right}
.add button{height:42px;padding:0 14px;border:0;border-radius:8px;background:var(--ink);color:var(--paper);font:inherit;font-weight:500;cursor:pointer}
/* 탭 */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:18px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:4}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:8px 2px;border-radius:9px;cursor:pointer;line-height:1.3}
.tabs button small{display:block;font-size:11.5px;font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);font-weight:500}
.tabs button[aria-selected="true"] small{color:var(--paper);opacity:.8}
section.panel{margin-top:10px}
.export{display:flex;gap:8px;margin-top:10px}
.export button{flex:1;height:46px;border:0;border-radius:10px;background:var(--save);color:#fff;font:inherit;font-weight:500;cursor:pointer}
.export button:disabled{opacity:.5}
.msg{font-size:13px;color:var(--muted);text-align:center;min-height:20px;margin-top:6px}
.hright{display:flex;align-items:center;gap:4px}
.eye{width:40px;height:40px;border:0;background:transparent;color:var(--ink);border-radius:50%;cursor:pointer;display:grid;place-items:center}
.eye:active{background:var(--line)}
.eye svg{width:22px;height:22px}
.export button.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,15,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-in{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:88vh;max-height:88dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding:14px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{margin:0;font-size:18px}
.x{width:40px;height:40px;border:0;background:transparent;color:var(--muted);font-size:24px;border-radius:50%;cursor:pointer}
#impBody{overflow-y:auto;flex:1;margin:6px -16px 0;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.sheet-foot button{flex:1;height:48px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.primary{flex:2 !important;background:var(--ink);color:var(--paper);border:0}
.primary:disabled{opacity:.45}
.imp-sum{font-size:15px;margin:6px 0 2px}
.imp-sum b{font-weight:700}
.imp-help{font-size:13px;color:var(--muted);margin:4px 0 8px}
.imp-row{display:grid;grid-template-columns:28px 1fr auto;gap:6px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.imp-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--save);grid-row:span 2;align-self:start;margin-top:3px}
.imp-row .mm{min-width:0}
.imp-row .m{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-row .d{font-size:12px;color:var(--muted)}
.imp-row select,.imp-map select{grid-column:2 / -1;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px;padding:0 8px}
.imp-row.off .mm,.imp-row.off .amt{opacity:.45}
.imp-map{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:15px}
.imp-map select{flex:1;max-width:65%}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--save);outline-offset:2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.trend svg{width:100%;height:auto;display:block;margin-top:8px}
.trend text{fill:var(--muted);font-size:11px;font-family:inherit}
.copy{width:100%;margin-top:14px;height:46px;border:1px dashed var(--muted);background:transparent;color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
/* 지출 분석 */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.seg button{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lead{font-size:15px;margin:12px 0 4px}
.lead b{font-weight:700}
details.cat{border-top:1px solid var(--line);padding:11px 0}
details.cat summary{list-style:none;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
.cat .top{display:flex;align-items:center;gap:8px}
.cat .cname{flex:1;font-weight:500}
.cat .cname em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.cat .chev{color:var(--muted);font-size:12px;transition:transform .2s}
.cat[open] .chev{transform:rotate(180deg)}
.track{height:8px;background:var(--paper);border-radius:4px;margin:7px 0 4px;overflow:hidden}
.track span{display:block;height:100%;border-radius:4px;transition:width .35s ease}
.cat .meta{font-size:12.5px;color:var(--muted)}
.cat ul{margin-top:6px;padding-left:16px}
.cat li{padding:6px 0;font-size:14px}
@media (prefers-reduced-motion: reduce){.track span,.cat .chev{transition:none}}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="monthnav">
      <button id="prev" aria-label="이전 달">‹</button>
      <div class="month" id="monthLabel"></div>
      <button id="next" aria-label="다음 달">›</button>
    </div>
    <div class="hright">
      <div class="sync" id="sync">불러오는 중</div>
      <button class="eye" id="eye" aria-pressed="false" aria-label="금액 숨기기"></button>
    </div>
  </header>

  <div class="hero">
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="leftrow">
      <span class="label">이번 달 쓸 수 있는 돈</span>
      <span class="big num" id="left">0원</span>
    </div>
    <div class="legend num" id="legend"></div>
    <div class="rate" id="rate"></div>
  </div>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="sections"></div>

  <section class="insight">
    <h2>어디에 많이 썼을까</h2>
    <div class="seg" id="insGroup"></div>
    <div class="seg" id="insSort"></div>
    <div id="insight"></div>
  </section>

  <button class="copy" id="copyPrev">지난달 월급·고정비·저축 불러오기</button>
  <div class="export">
    <button id="impBtn" class="alt">카드 내역 가져오기</button>
    <button id="xlsx">엑셀로 내보내기</button>
  </div>
  <div class="msg" id="msg">모든 달의 요약과 상세 내역이 한 파일로 저장돼요.</div>
  <p class="foot">입력한 내용은 자동으로 저장돼요.</p>
</div>

<div class="sheet" id="imp" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="impTitle">
    <div class="sheet-head"><h2 id="impTitle">카드 내역 가져오기</h2><button class="x" id="impClose" aria-label="닫기">×</button></div>
    <div id="impBody"></div>
    <div class="sheet-foot"><button class="ghost" id="impCancel">취소</button><button class="primary" id="impOk" disabled>추가</button></div>
  </div>
</div>
<input type="file" id="impFile" accept=".xls,.xlsx,.csv,.htm,.html" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SECTIONS = [
  {key:"income", title:"수입", hint:"분류를 고르고 금액을 입력하세요.", color:"var(--income)", ph:"월급",
    cats:["월급","상여금","부수입","이자·배당","용돈","기타"]},
  {key:"fixed",  title:"고정비", hint:"매달 같은 금액으로 나가는 돈이에요.", color:"var(--fixed)", ph:"통신비",
    cats:["주거","공과금","통신","보험","구독","대출상환","교통","교육","기타"]},
  {key:"saving", title:"저축·투자", hint:"미래를 위해 따로 떼어 두는 돈이에요.", color:"var(--save)", ph:"적금",
    cats:["적금","예금","청약","연금","주식·펀드","비상금","기타"]},
  {key:"spend",  title:"생활비 지출", hint:"그때그때 쓴 돈이에요.", color:"var(--spend)", ph:"점심", dated:true,
    cats:["식비","카페·간식","교통","쇼핑","생활용품","의료","문화·여가","경조사","기타"]},
];

let hidden = false;
try{ hidden = localStorage.getItem("budget-hide")==="1"; }catch(e){}
const won = n => hidden ? "●●●원" : new Intl.NumberFormat("ko-KR").format(Math.round(n)) + "원";
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth()+1);
const uid = () => Math.random().toString(36).slice(2,10);

let state = { months:{} };
let cur = new Date(); cur.setDate(1);
let store = null; // {load, save}
let activeTab = "income";

const emptyMonth = () => ({income:[],fixed:[],saving:[],spend:[]});
const month = k => state.months[k] || (state.months[k] = emptyMonth());
/* 반복 주기: 1회 / 매주 / 매일 / 평일 */
const FREQS=[["once","1회"],["week","매주"],["day","매일"],["weekday","평일"]];
function monthDays(k){ const [y,mo]=k.split("-").map(Number); return new Date(y,mo,0).getDate(); }
function weekdayCount(k){
  const [y,mo]=k.split("-").map(Number); let n=0;
  for(let i=1;i<=monthDays(k);i++){ const w=new Date(y,mo-1,i).getDay(); if(w>0&&w<6) n++; }
  return n;
}
function times(it,k=keyOf(cur)){
  switch(it.freq){
    case "week": return monthDays(k)/7;
    case "day": return monthDays(k);
    case "weekday": return weekdayCount(k);
    default: return 1;
  }
}
const eff = (it,k=keyOf(cur)) => Math.round((+it.amt||0)*times(it,k));
const sum = (arr,k=keyOf(cur)) => arr.reduce((s,x)=>s+eff(x,k),0);
function freqText(it,k=keyOf(cur)){
  if(!it.freq || it.freq==="once") return "";
  const t=times(it,k);
  const unit={week:"매주",day:"매일",weekday:"평일마다"}[it.freq];
  const cnt = it.freq==="week" ? t.toFixed(1)+"주" : t+"일";
  return `${unit} ${won(it.amt)} × ${cnt}`;
}

function totals(m,k=keyOf(cur)){
  const inc=sum(m.income,k), fix=sum(m.fixed,k), sav=sum(m.saving,k), sp=sum(m.spend,k);
  return {inc,fix,sav,sp,left:inc-fix-sav-sp};
}

/* ---------- 저장소: 서버(db) 우선, 없으면 브라우저 저장 ---------- */
function localStore(){
  return {
    async load(){ try{ const v=localStorage.getItem("budget-v1"); return v?JSON.parse(v):null }catch(e){ return null } },
    async save(d){ try{ localStorage.setItem("budget-v1", JSON.stringify(d)) }catch(e){} },
    label:"이 기기에 저장"
  };
}
async function initStore(){
  store = localStore();
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db");
    const user = await window.claude.use("user");
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.collection("data/users/" + id).doc("budget");
    store = {
      async load(){ const s = await ref.get(); return s.exists ? JSON.parse(JSON.stringify(s.data())) : null },
      async save(d){ await ref.set(JSON.parse(JSON.stringify(d))) },
      label:"계정에 저장됨"
    };
  }catch(e){ /* 로컬 저장 유지 */ }
}
let saveTimer=null;
function persist(){
  document.getElementById("sync").textContent="저장 중…";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{ await store.save(state); document.getElementById("sync").textContent=store.label }
    catch(e){ document.getElementById("sync").textContent="저장 실패 · 다시 입력해 주세요" }
  },600);
}

/* ---------- 화면 그리기 ---------- */
function render(){
  const k=keyOf(cur), m=month(k), t=totals(m);
  document.getElementById("monthLabel").textContent = cur.getFullYear()+"년 "+(cur.getMonth()+1)+"월";

  const left=document.getElementById("left");
  left.textContent = won(t.left);
  left.classList.toggle("neg", t.left<0);

  const base = Math.max(t.inc, t.fix+t.sav+t.sp, 1);
  document.getElementById("bar").innerHTML =
    [["fixed",t.fix],["save",t.sav],["spend",t.sp]]
    .map(([c,v])=>`<span style="width:${v/base*100}%;background:var(--${c})"></span>`).join("");

  document.getElementById("legend").innerHTML = [
    ["수입","var(--income)",t.inc],["고정비","var(--fixed)",t.fix],
    ["저축","var(--save)",t.sav],["생활비","var(--spend)",t.sp]
  ].map(([n,c,v])=>`<div><span><i style="background:${c}"></i>${n}</span><span>${won(v)}</span></div>`).join("");

  document.getElementById("rate").textContent = t.inc>0
    ? `저축률 ${Math.round(t.sav/t.inc*100)}% · 고정비 비중 ${Math.round(t.fix/t.inc*100)}%`
    : "수입을 입력하면 저축률을 계산해 드려요.";

  const tabs=document.getElementById("tabs");
  tabs.innerHTML="";
  SECTIONS.forEach(s=>{
    const b=document.createElement("button");
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(s.key===activeTab));
    b.innerHTML=`${s.title.replace(" 지출","")}<small>${hidden ? "●●●" : Math.round(sum(m[s.key])/10000).toLocaleString("ko-KR")+"만"}</small>`;
    b.onclick=()=>{ activeTab=s.key; render(); };
    tabs.appendChild(b);
  });

  const wrap=document.getElementById("sections");
  wrap.innerHTML="";
  SECTIONS.filter(s=>s.key===activeTab).forEach(s=>{
    const items=m[s.key];
    const sec=document.createElement("section");
    sec.className="panel"; sec.setAttribute("role","tabpanel");
    sec.innerHTML=`<h2>${s.title}<small class="num">${won(sum(items))}</small></h2>

        <span class="nm"><span class="name"></span>${freqText(it)?`<small class="sub num">${freqText(it)}</small>`:""}</span><span class="tag">${it.cat||"기타"}</span><span class="amt num">${won(eff(it))}</span>

      li.querySelector(".del").onclick=()=>{ m[s.key]=items.filter(x=>x.id!==it.id); persist(); render(); };
      ul.appendChild(li);
    });
    const [nIn,aIn]=sec.querySelectorAll("input");
    const sel=sec.querySelector("select");
    nIn.placeholder=sel.value;
    sel.onchange=()=>{ nIn.placeholder=sel.value; };
    const groups={}, total=sum(items);
    items.forEach(x=>{ const c=x.cat||"기타"; groups[c]=(groups[c]||0)+eff(x); });
    const entries=Object.entries(groups).sort((a,b)=>b[1]-a[1]);
    const bd=sec.querySelector(".breakdown");
    if(entries.length){
      bd.innerHTML=entries.map(([c,v])=>`<span>${c}<b>${won(v)}</b><em>${total?Math.round(v/total*100):0}%</em></span>`).join("");
    } else bd.remove();
    let freq="once";
    const pv=sec.querySelector(".preview");
    const unitLabel={once:"",week:"주",day:"일",weekday:"일(평일)"};
    const updatePreview=()=>{
      const amt=+aIn.value.replace(/[^\d]/g,"");
      aIn.placeholder = {once:"금액",week:"한 주 금액",day:"하루 금액",weekday:"평일 하루 금액"}[freq];
      if(freq==="once" || !amt){ pv.textContent = freq==="once" ? "" : "금액을 입력하면 이번 달 합계를 계산해 드려요."; return; }
      const t=times({freq},keyOf(cur));
      const cnt = freq==="week" ? t.toFixed(1) : t;
      pv.innerHTML=`${won(amt)} × ${cnt}${unitLabel[freq]} = 이번 달 <b>${won(Math.round(amt*t))}</b>`;
    };
    sec.querySelectorAll(".freq button").forEach(b=>{
      b.onclick=()=>{
        freq=b.dataset.f;
        sec.querySelectorAll(".freq button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
        updatePreview();
      };
    });
    aIn.addEventListener("input",()=>{
      const v=aIn.value.replace(/[^\d]/g,"");
      aIn.value = v ? new Intl.NumberFormat("ko-KR").format(+v) : "";
      updatePreview();
    });
    const add=()=>{
      const amt=+aIn.value.replace(/[^\d]/g,"");
      const name=nIn.value.trim()||sel.value;
      if(!amt){ aIn.focus(); return; }
      const it={id:uid(),name,amt,cat:sel.value,freq};
      if(s.dated && freq==="once") it.day=new Date().getDate();
      m[s.key].push(it); persist(); render();
      const again=document.querySelector("#sections section input");
      again && again.focus({preventScroll:true});
    };
    sec.querySelector(".add .go").onclick=add;
    aIn.addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });
    wrap.appendChild(sec);
  });

  renderInsight();
}

let insGroup="all", insSort="amt";
const INS_GROUPS=[["all","전체 지출"],["fixed","고정비"],["spend","생활비"],["saving","저축·투자"]];
const INS_SORTS=[["amt","금액순"],["n","횟수순"]];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function segButtons(el, list, val, onPick){
  el.innerHTML="";
  list.forEach(([k,label])=>{
    const b=document.createElement("button");
    b.textContent=label; b.setAttribute("aria-pressed", String(k===val));
    b.onclick=()=>onPick(k);
    el.appendChild(b);
  });
}

function renderInsight(){
  segButtons(document.getElementById("insGroup"), INS_GROUPS, insGroup, k=>{ insGroup=k; renderInsight(); });
  segButtons(document.getElementById("insSort"), INS_SORTS, insSort, k=>{ insSort=k; renderInsight(); });

  const m=month(keyOf(cur));
  const keys = insGroup==="all" ? ["fixed","spend"] : [insGroup];
  const map={};
  keys.forEach(k=>{
    const sec=SECTIONS.find(s=>s.key===k);
    m[k].forEach(it=>{
      const cat=it.cat||"기타", id=k+"|"+cat;
      const g=map[id]||(map[id]={cat,k,color:sec.color,amt:0,n:0,items:[]});
      g.amt+=eff(it); g.n+=Math.max(1,Math.round(times(it))); g.items.push(it);
    });
  });
  const rows=Object.values(map);
  const out=document.getElementById("insight");
  if(!rows.length){ out.innerHTML=`<p class="empty">이번 달에 입력한 항목이 없어요. 위 탭에서 항목을 추가하면 여기서 분석해 드려요.</p>`; return; }

  const totalAmt=rows.reduce((s,r)=>s+r.amt,0), totalN=rows.reduce((s,r)=>s+r.n,0);
  rows.sort((a,b)=> insSort==="amt" ? (b.amt-a.amt || b.n-a.n) : (b.n-a.n || b.amt-a.amt));
  const metric = r => insSort==="amt" ? r.amt : r.n;
  const max = Math.max(metric(rows[0]),1);
  const short = {fixed:"고정비", spend:"생활비", saving:"저축"};
  const pctA = r => totalAmt ? Math.round(r.amt/totalAmt*100) : 0;
  const pctN = r => totalN ? Math.round(r.n/totalN*100) : 0;

  const top=rows[0];
  const lead = insSort==="amt"
    ? `가장 많이 쓴 곳은 <b>${esc(top.cat)}</b>, 전체의 ${pctA(top)}%예요.`
    : `가장 자주 쓴 곳은 <b>${esc(top.cat)}</b>, 총 ${totalN}건 중 ${top.n}건이에요.`;

  out.innerHTML = `<p class="lead">${lead}</p>` + rows.map(r=>{
    const items=[...r.items].sort((a,b)=>eff(b)-eff(a))
      .map(it=>`<li><span class="nm"><span class="name">${esc(it.name)}</span>${freqText(it)?`<small class="sub num">${freqText(it)}</small>`:""}</span>${it.day?`<span class="date num">${it.day}일</span>`:""}<span class="amt num">${won(eff(it))}</span></li>`).join("");
    return `<details class="cat"><summary>
      <div class="top"><span class="dot" style="background:${r.color}"></span>
        <span class="cname">${esc(r.cat)}${insGroup==="all"?`<em>${short[r.k]}</em>`:""}</span>
        <span class="amt num">${won(r.amt)}</span><span class="chev" aria-hidden="true">▾</span></div>
      <div class="track"><span style="width:${metric(r)/max*100}%;background:${r.color}"></span></div>
      <div class="meta num">금액 ${pctA(r)}% · ${r.n}건(${pctN(r)}%) · 건당 평균 ${won(r.amt/r.n)}</div>
    </summary><ul>${items}</ul></details>`;
  }).join("");
}

function renderTrend(){
  const pts=[];
  for(let i=5;i>=0;i--){
    const d=new Date(cur.getFullYear(), cur.getMonth()-i, 1);
    const m=state.months[keyOf(d)];
    pts.push({label:(d.getMonth()+1)+"월", v:m?sum(m.saving):0, isCur:i===0});
  }
  const max=Math.max(...pts.map(p=>p.v),1), W=320, H=120, bw=34, gap=(W-bw*6)/5;
  const bars=pts.map((p,i)=>{
    const h=Math.max(p.v/max*80, p.v?3:1), x=i*(bw+gap), y=95-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="var(--save)" opacity="${p.isCur?1:.45}"/>
      <text x="${x+bw/2}" y="112" text-anchor="middle">${p.label}</text>
      ${p.v?`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle">${Math.round(p.v/10000)}만</text>`:""}`;
  }).join("");
  document.getElementById("trend").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 6개월 저축액">${bars}</svg>`;
}

const guessCat = m => (CAT_RULES.find(([,re])=>re.test(m))||["기타"])[0];

function parseDate(v, fy){
  if(v instanceof Date && !isNaN(v)) return {y:v.getFullYear(),m:v.getMonth()+1,d:v.getDate()};
  if(typeof v==="number" && v>20000 && v<80000){ const d=XLSX.SSF.parse_date_code(v); return {y:d.y,m:d.m,d:d.d}; }
  const s=String(v??"").trim(); let r;
  if((r=s.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/))) return {y:+r[1],m:+r[2],d:+r[3]};
  if((r=s.match(/^(\d{4})(\d{2})(\d{2})/))) return {y:+r[1],m:+r[2],d:+r[3]};
  if((r=s.match(/^(\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/))) return {y:2000+ +r[1],m:+r[2],d:+r[3]};
  if((r=s.match(/^(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/))) return {y:fy,m:+r[1],d:+r[2]};
  return null;
}
function parseAmt(v){
  if(typeof v==="number") return v;
  let s=String(v??"").replace(/[,원\s₩]/g,"");
  const neg=/^\(.*\)$/.test(s)||s.startsWith("-");
  s=s.replace(/[()\-]/g,"");
  const n=parseFloat(s);
  return isNaN(n)?NaN:(neg?-n:n);
}
const clean = c => String(c??"").replace(/\s/g,"");
function findHeader(rows){
  for(let r=0;r<Math.min(rows.length,40);r++){
    const c=rows[r].map(clean);
    const di=c.findIndex(x=>/이용일|승인일|거래일|사용일|이용일자|일자|날짜/.test(x));
    const mi=c.findIndex(x=>/가맹점|이용하신곳|이용처|사용처|상호/.test(x));
    let ai=c.findIndex(x=>/이용금액|승인금액|사용금액/.test(x));
    if(ai<0) ai=c.findIndex(x=>/금액/.test(x) && !/할인|적립|포인트|수수료|잔액|이자/.test(x));
    if(di>=0 && mi>=0 && ai>=0){
      const ci=c.findIndex((x,i)=>![di,mi,ai].includes(i) && /취소|승인구분|상태/.test(x));
      return {row:r,di,mi,ai,ci};
    }
  }
  return null;
}

let imp=null; // {rows, header, map, items}

async function readCardFile(file){
  const buf=await file.arrayBuffer();
  let wb;
  if(/\.csv$/i.test(file.name)){
    let text;
    try{ text=new TextDecoder("utf-8",{fatal:true}).decode(buf); }
    catch(e){ text=new TextDecoder("euc-kr").decode(buf); }
    wb=XLSX.read(text,{type:"string",cellDates:true});
  } else {
    wb=XLSX.read(buf,{type:"array",cellDates:true});
  }
  let first=null;
  for(const name of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:""});
    if(!first) first=rows;
    const h=findHeader(rows);
    if(h) return {rows,h};
  }
  return {rows:first||[],h:null};
}

function buildItems(rows,h){
  const fy=cur.getFullYear(), out=[];
  const existing=new Set();
  Object.values(state.months).forEach(m=>m.spend.forEach(it=>{ if(it.ref) existing.add(it.ref); }));
  for(let r=h.row+1;r<rows.length;r++){
    const row=rows[r];
    const date=parseDate(row[h.di],fy);
    const merch=String(row[h.mi]??"").trim();
    const amt=parseAmt(row[h.ai]);
    if(!date || !merch || isNaN(amt) || amt===0) continue;
    if(/^(합계|소계|총계|총\s*이용)/.test(merch)) continue;
    const cancelled = amt<0 || (h.ci>=0 && /취소/.test(String(row[h.ci])));
    const ref=`${date.y}-${pad(date.m)}-${pad(date.d)}|${merch}|${Math.abs(amt)}`;
    const dup=existing.has(ref);
    out.push({date,merch,amt:Math.abs(Math.round(amt)),cat:guessCat(merch),ref,cancelled,dup,on:!cancelled&&!dup});
  }
  out.sort((a,b)=>(b.date.y-a.date.y)||(b.date.m-a.date.m)||(b.date.d-a.date.d));
  return out;
}

    ${items.map((x,i)=>`
      <div class="imp-row${x.on?"":" off"}">
        <input type="checkbox" data-i="${i}" ${x.on?"checked":""} aria-label="${esc(x.merch)} 포함">
        <div class="mm"><div class="m">${esc(x.merch)}</div>
          <div class="d num">${x.date.m}월 ${x.date.d}일${x.cancelled?" · 취소":""}${x.dup?" · 이미 추가됨":""}</div></div>
        <div class="amt num">${won(x.amt)}</div>
        <select data-i="${i}" aria-label="${esc(x.merch)} 분류">${cats.map(c=>`<option${c===x.cat?" selected":""}>${c}</option>`).join("")}</select>
      </div>`).join("")}`;
  impEl("impBody").querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{ items[+cb.dataset.i].on=cb.checked; renderPreview(); });
  impEl("impBody").querySelectorAll('select').forEach(s=>s.onchange=()=>{ items[+s.dataset.i].cat=s.value; });
  impEl("impOk").textContent = sel.length ? `${sel.length}건 생활비에 추가` : "선택한 내역이 없어요";
  impEl("impOk").disabled = !sel.length;
  impEl("impOk").onclick=commitImport;
}

function commitImport(){
  const sel=imp.items.filter(x=>x.on);
  const byMonth={};
  sel.forEach(x=>{
    const k=`${x.date.y}-${pad(x.date.m)}`;
    month(k).spend.push({id:uid(),name:x.merch,amt:x.amt,cat:x.cat,freq:"once",day:x.date.d,ref:x.ref,src:"card"});
    byMonth[k]=(byMonth[k]||0)+1;
  });
  persist();
  const ks=Object.keys(byMonth).sort();
  const last=ks[ks.length-1];
  if(last){ const [y,m]=last.split("-").map(Number); cur=new Date(y,m-1,1); }
  activeTab="spend";
  closeSheet(); render();
  impEl("msg").textContent = ks.map(k=>`${+k.split("-")[1]}월 ${byMonth[k]}건`).join(", ")+" 추가했어요.";
}

impEl("impBtn").onclick=()=>{
  if(!window.XLSX){ impEl("msg").textContent="엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."; return; }
  impEl("impFile").value=""; impEl("impFile").click();
};
impEl("impFile").onchange=async e=>{
  const file=e.target.files[0]; if(!file) return;
  imp={};
  impEl("impBody").innerHTML=`<p class="imp-help">파일을 읽는 중…</p>`;
  impEl("impOk").disabled=true;
  openSheet();
  try{
    const {rows,h}=await readCardFile(file);
    imp.rows=rows; imp.h=h;
    if(h){ imp.items=buildItems(rows,h); renderPreview(); }
    else renderMapper();
  }catch(err){
    impEl("impBody").innerHTML=`<p class="imp-help">파일을 열지 못했어요. 암호가 걸린 파일이면 엑셀에서 열어 암호 없이 다시 저장한 뒤 올려 주세요.</p>`;
  }
};
impEl("impClose").onclick=closeSheet;
impEl("impCancel").onclick=closeSheet;
impEl("imp").addEventListener("click",e=>{ if(e.target.id==="imp") closeSheet(); });

/* ---------- 엑셀 내보내기 ---------- */
function buildWorkbook(){
  const keys=Object.keys(state.months).sort();
  const summary=[["월","수입","고정비","저축·투자","생활비","남은 돈","저축률(%)"]];
  const detail=[["월","구분","분류","항목","주기","단위 금액","월 금액","날짜"]];
  const FL={once:"1회",week:"매주",day:"매일",weekday:"평일"};
  keys.forEach(k=>{
    const m=state.months[k], t=totals(m,k);
    if(!t.inc && !t.fix && !t.sav && !t.sp) return;
    summary.push([k,t.inc,t.fix,t.sav,t.sp,t.left,t.inc?Math.round(t.sav/t.inc*100):0]);
    SECTIONS.forEach(s=>m[s.key].forEach(it=>{
      detail.push([k,s.title,it.cat||"기타",it.name,FL[it.freq||"once"],+it.amt||0,eff(it,k),it.day?`${k}-${pad(it.day)}`:""]);
    }));
  });
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet(summary); ws1["!cols"]=[{wch:10},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:10}];
  const ws2=XLSX.utils.aoa_to_sheet(detail);  ws2["!cols"]=[{wch:10},{wch:12},{wch:12},{wch:18},{wch:8},{wch:12},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws1,"월별 요약");
  XLSX.utils.book_append_sheet(wb,ws2,"상세 내역");
  return {wb, rows:summary.length-1};
}
let downloads=null;
document.getElementById("xlsx").onclick=async()=>{
  const msg=document.getElementById("msg"), btn=document.getElementById("xlsx");
  if(!window.XLSX){ msg.textContent="엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."; return; }
  const {wb,rows}=buildWorkbook();
  if(!rows){ msg.textContent="내보낼 기록이 없어요. 먼저 항목을 입력해 주세요."; return; }
  const today=new Date();
  const filename=`가계부_${today.getFullYear()}${pad(today.getMonth()+1)}${pad(today.getDate())}.xlsx`;
  btn.disabled=true;
  try{
    const data=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    if(downloads) await downloads.save({filename,data:new Uint8Array(data)});
    else XLSX.writeFile(wb, filename);
    msg.textContent=`${filename} 저장됨`;
  }catch(e){
    msg.textContent = e && e.code==="declined" ? "저장을 취소했어요." : "저장하지 못했어요. 잠시 후 다시 눌러 주세요.";
  }finally{ btn.disabled=false; }
};

(async()=>{
  render();
  if(window.claude && window.claude.use){
    window.claude.use("downloads").then(d=>{
      downloads=d;
      if(!d){ document.getElementById("xlsx").disabled=true; document.getElementById("msg").textContent="이 화면에서는 파일 저장을 지원하지 않아요."; }
    }).catch(()=>{});
  }
  await initStore();
  try{
    const d=await store.load();
    if(d && d.months){
      state=JSON.parse(JSON.stringify(d));
      Object.values(state.months).forEach(m=>{ ["income","fixed","saving","spend"].forEach(k=>{ if(!Array.isArray(m[k])) m[k]=[]; }); });
    }
  }catch(e){}
  document.getElementById("sync").textContent=store.label;
  render();
})();
</script>
